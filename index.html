<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLITCH // TRACE</title>
  <meta name="description" content="Hyper-casual precision arcade. One-tap cyberpunk reflex runner.">
  <meta name="theme-color" content="#060018">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cyan: #00E5FF;
      --magenta: #FF00FF;
      --dark: #060018;
      --surface: #0E0028;
      --lavender: #E0E0FF;
    }

    body {
      background: var(--dark);
      color: var(--lavender);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Scanlines overlay ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 229, 255, 0.015) 2px,
        rgba(0, 229, 255, 0.015) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ── Poster / Hero ── */
    .poster {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      aspect-ratio: 2 / 1;
      overflow: hidden;
      border-bottom: 1px solid rgba(0, 229, 255, 0.15);
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 60%,
        var(--dark) 100%
      );
    }

    /* ── Content ── */
    .content {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
      text-align: center;
    }

    .icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin: 0 auto 2rem;
      display: block;
      box-shadow:
        0 0 30px rgba(0, 229, 255, 0.3),
        0 0 60px rgba(0, 229, 255, 0.1);
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      line-height: 1.1;
      margin-bottom: 0.4rem;
    }

    h1 .glitch { color: var(--cyan); }
    h1 .sep { color: var(--magenta); font-size: 0.7em; }
    h1 .trace { color: var(--cyan); }

    .tagline {
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--magenta);
      opacity: 0.8;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      margin: 0 auto 2.5rem;
    }

    .desc {
      font-size: 0.95rem;
      line-height: 1.8;
      color: rgba(224, 224, 255, 0.6);
      margin-bottom: 3rem;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Store buttons ── */
    .stores {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .stores a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 6px;
      color: var(--cyan);
      text-decoration: none;
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      background: rgba(0, 229, 255, 0.04);
    }

    .stores a:hover {
      background: rgba(0, 229, 255, 0.1);
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
    }

    .stores a svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ── CTA pulse ── */
    .cta {
      display: inline-block;
      color: var(--magenta);
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      animation: pulse 1.4s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.5; }
      to   { opacity: 1; }
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: rgba(224, 224, 255, 0.2);
      border-top: 1px solid rgba(0, 229, 255, 0.06);
    }

    footer a {
      color: rgba(0, 229, 255, 0.35);
      text-decoration: none;
    }

    footer a:hover { color: var(--cyan); }

    /* ── Glitch flicker on title ── */
    @keyframes flicker {
      0%, 93%, 95%, 97%, 100% { opacity: 1; }
      94% { opacity: 0.7; }
      96% { opacity: 0.85; }
    }

    h1 { animation: flicker 4s ease-in-out infinite; }
  </style>
</head>
<body>

  <!-- Poster -->
  <div class="poster">
    <img src="playstore_assets/feature_graphic.jpg" alt="GLITCH // TRACE - Cyberpunk Arcade" loading="eager">
  </div>

  <!-- Content -->
  <main class="content">
    <img src="playstore_assets/icon_512.png" alt="GLITCH // TRACE icon" class="icon">

    <h1>
      <span class="glitch">GLITCH</span>
      <span class="sep"> // </span><br>
      <span class="trace">// TRACE</span>
    </h1>

    <p class="tagline">One-Tap Cyber Arcade</p>

    <div class="divider"></div>

    <p class="desc">
      Navigate the neon void. Leave your trace.
      Don't cross it.
    </p>

    <div class="stores">
      <a href="https://play.google.com/store/apps/details?id=com.subzoron.glitchtrace" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M3 20.5v-17A1.5 1.5 0 0 1 4.5 2h15A1.5 1.5 0 0 1 21 3.5v17l-9-4.5L3 20.5Z"/></svg>
        Google Play
      </a>
      <a href="https://apps.apple.com/app/glitch-trace/id0000000000" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11Z"/></svg>
        App Store
      </a>
    </div>

    <span class="cta">Tap to start</span>
  </main>

  <footer>
    &copy; 2025 subzoron
  </footer>

</body>
</html>
